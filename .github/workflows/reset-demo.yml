name: Reset demo data

# Wipes and reseeds the live demo database every night so visitors always
# find a clean demo, whatever earlier visitors did. Free on GitHub Actions.
#
# Setup: GitHub repo -> Settings -> Secrets and variables -> Actions ->
# New repository secret: MONGODB_URI = your Atlas connection string.

on:
  schedule:
    - cron: '30 20 * * *' # 20:30 UTC = 02:00 IST
  workflow_dispatch: # lets you run it by hand from the Actions tab

jobs:
  reset:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --omit=dev
      - run: npm run reset-demo
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
